name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# GITHUB_TOKEN default-nya punya scope yang lebih besar dari yang CI ini
# perlukan, dan default itu berubah dari waktu ke waktu. Job di bawah hanya
# membaca dan menjalankan test, jadi scopes-nya dikecilkan eksplisit di sini.
# Kalau sebuah step butuh tulis (misalnya membuat komentar PR), permissions di
# level job harus menaikkan kembali secara eksplisit, bukan mengandalkan default
# GitHub.
permissions:
  contents: read

# Cancel PR lama saat commit baru masuk. Tanpa ini, queue menumpuk dan
# checkout lama tetap berjalan memakai menit runner yang sama, jadi perubahan
# kecil bisa menunggu lebih lama dari yang perlu.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
# Action di-pin ke SHA, bukan ke tag. Tag (@v4) bisa dipindahkan ke commit
      # lain kapan saja tanpa ada perubahan di file ini, dan job ini menjalankan
      # kode dari repo pihak ketiga memakai kredensial CI. SHA membuat isi yang
      # benar-benar dijalankan eksplisit dan bisa diaudit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          #kedua suite punya requirements-test.txt masing-masing. backend/
          # butuh pytest-asyncio karena backend/tests/test_model_discovery.py
          # memakai @pytest.mark.asyncio; tanpa ini 3 test itu DILEWATI
          # (async def functions are not natively supported) bukan gagal,
          # jadi suite tetap hijau padahal cakupannya berkurang.
          pip install -r requirements-test.txt
          pip install -r ../security/requirements-test.txt

      - name: Byte-compile (syntax check)
        run: python -m compileall -q .

      - name: Verify deprecated APIs are gone
        run: |
          # DEBT: datetime.utcnow() dihapus di Python 3.12
          if grep -rn "utcnow()" --include="*.py" . ; then
            echo "::error:: datetime.utcnow() masih dipakai"
            exit 1
          fi
          # DEBT: @app.on_event("startup") deprecated di FastAPI 0.109+
          if grep -rn "on_event(" --include="*.py" . ; then
            echo "::error:: on_event() masih dipakai"
            exit 1
          fi

      - name: CORS wildcard check
        run: |
          # --exclude-dir=tests itu wajib, bukan gaya penulisan. Test
          # test_tidak_ada_wildcard_origin() pada dasarnya HARUS memuat
          # literal 'allow_origins=["*"]' supaya bisa membandingkannya dengan
          # isi main.py. Tanpa exclude, grep mencocokkan string di dalam
          # assertion itu dan membalas "wildcard masih ada" - guard ini
          # soal kode produksi, jadi test tidak boleh ikut dihitung.
          if grep -rn 'allow_origins=\["\*"\]' --include="*.py" --exclude-dir=tests . ; then
            echo "::error:: allow_origins wildcard masih ada (BUG-11)"
            exit 1
          fi

      # WAJIB dijalankan dari repo root dengan path eksplisit.
      # Sebelumnya step ini jalan dari working-directory: backend, dan pytest
      # hanya menerapkan `testpaths` dari pytest.ini kalau invocation dir ==
      # rootdir. Dari backend/ pytest mengumpulkan [backend/] saja (120 test),
      # jadi seluruh security/tests (127 test, termasuk suite regresi
      # path-traversal isu #63/#66) TIDAK PERNAH jalan di CI — CI hijau
      # padahal regresinya lolos senyap. Path eksplisit + guard jumlah
      # pengumpulan bikin suite ini tidak bisa menyusut diam-diam.
      # Referensi: pytest _pytest/config/__init__.py::_decide_args
      - name: Run pytest (backend + security)
        env:
          TRUSTHUB_API_TOKEN: ci-test-token-abcdefghijklmnop
        working-directory: .
        run: |
          set -e
          SEC=$(python -m pytest --collect-only -q security/tests | tail -1 | awk '{print $1}')
          BACK=$(python -m pytest --collect-only -q backend/tests | tail -1 | awk '{print $1}')
          echo "collected: security/tests=$SEC backend/tests=$BACK"
          if [ "${SEC:-0}" -lt 100 ]; then
            echo "::error::security/tests cuma mengumpulkan $SEC test"
            exit 1
          fi
          if [ "${BACK:-0}" -lt 100 ]; then
            echo "::error::backend/tests cuma mengumpulkan $BACK test"
            exit 1
          fi
          python -m pytest -q backend/tests security/tests

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22.6+ untuk --experimental-strip-types, 23.6+ strip_types
          # on by default. Node 20 TIDAK bisa menjalankan file test .ts sama
          # sekali ("Could not find lib/*.test.ts").
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint dijalankan di CI karena ia satu-satunya gerbang yang menangkap
      # masalah yang lolos typecheck: aturan react-hooks yang salah, import
      # tak terpakai, dan aturan aksesibilitas jsx-a11y. Tanpa step ini,
      # perubahan yang evocatif secara visual lolos ke main tanpa pernah
      # di-lint.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          TRUSTHUB_API_TOKEN: ci-test-token-abcdefghijklmnop
        run: npm run build
