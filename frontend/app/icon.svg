<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tab icon. Two shapes only, because this has to stay readable at 16px
       in a browser tab: a dark rounded plate, and a green shield with a check.
       The green is the TRUSTED end of the scale in TrustBadge; the amber and
       red ends are deliberately absent - an icon should not claim a verdict. -->
  <rect width="32" height="32" rx="7" fill="#0a0e14" />
  <path
    d="M16 5.5 25 9v6.5c0 5.2-3.6 9.6-9 11-5.4-1.4-9-5.8-9-11V9l9-3.5Z"
    fill="none"
    stroke="#4ade80"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <path
    d="m12.2 16 2.6 2.7 5-5.4"
    fill="none"
    stroke="#4ade80"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>