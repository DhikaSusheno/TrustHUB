<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tab icon. Same mark as components/shared/LogoMark.tsx, redrawn at 32 so the
       stroke can be heavier: at 16px in a browser tab a 1.6 stroke disappears.
       This replaces a green shield, which was a third drawing of the logo and
       also asserted a TRUSTED verdict. An icon should not rule on anything. -->
  <rect width="32" height="32" rx="7" fill="#0a0e14" />
  <path
    d="M16 4 26.39 10 26.39 22 16 28 5.61 22 5.61 10Z"
    fill="none"
    stroke="#3b82f6"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <circle
    cx="16"
    cy="16"
    r="4.6"
    fill="none"
    stroke="#3b82f6"
    stroke-width="2.2"
  />
</svg>